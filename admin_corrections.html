{% extends "admin_layout.html" %}{% block content %}<div class="card"><h3>Correction Requests</h3><table class="table"><tr><th>Student</th><th>Field</th><th>Current</th><th>Correct</th><th>Status</th><th>Action</th></tr>{% for r in rows %}<tr><td>{{r['name'] or r['student_id']}}</td><td>{{r['field']}}</td><td>{{r['current_value']}}</td><td>{{r['correct_value']}}</td><td><span class="badge">{{r['status']}}</span></td><td><form method="post" action="{{url_for('admin_correction_status',cid=r['id'],status='Approved')}}" style="display:inline"><button class="btn">Approve</button></form> <form method="post" action="{{url_for('admin_correction_status',cid=r['id'],status='Rejected')}}" style="display:inline"><button class="btn" style="background:#b42318">Reject</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
