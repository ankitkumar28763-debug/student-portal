{% extends "layout.html" %}{% block content %}<div class="card"><h3>Upload Assignment</h3><form class="form" method="post" enctype="multipart/form-data"><label>Subject</label><input name="subject" placeholder="e.g. Programming" required><label>Assignment Title</label><input name="title" placeholder="Enter title" required><label>File (max 5 MB)</label><input type="file" name="file" required><button class="btn" type="submit">Upload Assignment</button></form></div><div class="card" style="margin-top:18px"><h3>Your Uploads</h3><table class="table"><tr><th>Subject</th><th>Title</th><th>File</th><th>Date</th></tr>{% for r in rows %}<tr><td>{{r['subject']}}</td><td>{{r['title']}}</td><td><a href="{{url_for('download',filename=r['filename'])}}">Download</a></td><td>{{r['uploaded_at']}}</td></tr>{% endfor %}</table></div>{% endblock %}
